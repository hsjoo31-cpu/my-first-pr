name: Weekly New-High Screener

on:
  schedule:
    # marcap은 평일에만, 하루 늦게 갱신됨 → 금요일 종가는 다음 영업일인
    # 월요일 낮(~12:18 UTC ≈ 월 21시 KST)에야 올라옴.
    # 따라서 월 23:00 KST(월 14:00 UTC) 1차 시도, 화 11:00 KST(화 02:00 UTC) 안전망 재시도.
    # 데이터 미반영 시 스크립트가 스스로 보류(REQUIRE_FRESH=1).
    - cron: "0 14 * * 1"
    - cron: "0 2 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas pyarrow numpy

      - name: Run screener
        env:
          REQUIRE_FRESH: "1"
        run: python scripts/weekly_newhigh_screener.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/newhigh_signals.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: auto-update 52-week new-high signals"
            git push
          fi
