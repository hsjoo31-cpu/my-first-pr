name: Weekly New-High Screener

on:
  schedule:
    # marcap 데이터는 금요일 종가가 토요일 저녁(KST)에 반영됨.
    # 토 22:00 KST(UTC 13:00 토) 1차 시도, 일 08:00 KST(UTC 23:00 토) 재시도,
    # 월 08:00 KST(UTC 23:00 일) 최종 시도. 데이터 미반영 시 스크립트가 스스로 보류.
    - cron: "0 13 * * 6"
    - cron: "0 23 * * 6"
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas pyarrow numpy

      - name: Run screener
        env:
          REQUIRE_FRESH: "1"
        run: python scripts/weekly_newhigh_screener.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/newhigh_signals.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: auto-update 52-week new-high signals"
            git push
          fi
