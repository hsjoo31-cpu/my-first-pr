name: IPO Data Updater

on:
  schedule:
    # 매주 월요일 KST 08:00 (UTC 23:00 일요일) 업데이트
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch IPO data
        run: python scripts/ipo_fetcher.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ipo_data.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: auto-update IPO backtest data"
            git push
          fi
