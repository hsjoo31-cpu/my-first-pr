name: Limit-up Data Updater

on:
  schedule:
    # marcap은 평일에 하루 늦게 갱신 → 화 11시 KST(UTC 02:00) 실행이면 전일 종가까지 반영
    - cron: "0 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas pyarrow numpy

      - name: Fetch limit-up data
        run: python scripts/limitup_fetcher.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/limitup_data.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: auto-update limit-up backtest data"
            git push
          fi
